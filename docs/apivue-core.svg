<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#17142d"/><stop offset="1" stop-color="#070911"/></radialGradient>
  <radialGradient id="core" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#18204c"/><stop offset=".7" stop-color="#090d20"/><stop offset="1" stop-color="#050711"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
  <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#5ee7ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#b44cff"/></linearGradient>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.label{font-size:25px;font-weight:650;fill:#f7f7ff}.sub{font-size:14px;fill:#8d91a8}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="800" cy="445" r="250" fill="#6b4cff" opacity=".08" filter="url(#soft)"/>
<!-- connections -->
<g fill="none" stroke-linecap="round" stroke-dasharray="7 12" stroke-width="3" opacity=".9">
 <path d="M610 360 L390 190 L225 125" stroke="#a66cff"/>
 <path d="M990 360 L1210 190 L1375 125" stroke="#ffad2f"/>
 <path d="M565 445 L360 445 L200 445" stroke="#ff3fb4"/>
