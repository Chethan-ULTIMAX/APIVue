 <g transform="translate(660 790)"><rect width="280" height="82" rx="18" fill="#0d1020" stroke="#26e879" stroke-width="2"/><circle cx="35" cy="41" r="18" fill="#26e879" opacity=".18"/><text x="70" y="47" class="label">Hack The Box</text></g>
