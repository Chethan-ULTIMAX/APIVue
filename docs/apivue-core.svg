 <circle cx="360" cy="445" r="6" fill="#ff4bbb"/><circle cx="1240" cy="445" r="6" fill="#ff405e"/>
 <circle cx="405" cy="700" r="6" fill="#28c8ff"/><circle cx="1195" cy="700" r="6" fill="#ff3f93"/><circle cx="800" cy="780" r="6" fill="#27ee7c"/>
</g>
<!-- core -->
<circle cx="800" cy="445" r="188" fill="none" stroke="#704dff" stroke-opacity=".22" stroke-width="2"/>
<circle cx="800" cy="445" r="154" fill="url(#core)" stroke="#704dff" stroke-width="3" opacity=".98"/>
<circle cx="800" cy="445" r="132" fill="none" stroke="url(#brand)" stroke-width="7" filter="url(#glow)"/>
<circle cx="800" cy="445" r="116" fill="none" stroke="#6d67ff" stroke-opacity=".35" stroke-width="2"/>
<rect x="735" y="372" width="130" height="130" rx="20" fill="#080b16" stroke="#4e59b8" stroke-width="2"/>
<!-- logo mark -->
<path d="M764 417 l20 12 20-20 20 12 20-20 16 10-36 36-20-12-20 20-20-12z" fill="url(#brand)"/>
<text x="800" y="540" text-anchor="middle" font-size="32" font-weight="750" fill="#fff">APIVue Core</text>
<text x="800" y="568" text-anchor="middle" class="sub">DATA • HISTORY • ANALYTICS • INSIGHTS</text>
<!-- cards -->
<g>
 <g transform="translate(95 70)"><rect width="285" height="92" rx="18" fill="#0d1020" stroke="#8756ff" stroke-width="2"/><circle cx="35" cy="46" r="18" fill="#8756ff" opacity=".18"/><text x="70" y="52" class="label">GitHub</text><text x="70" y="72" class="sub">code &amp; activity</text></g>
 <g transform="translate(1220 70)"><rect width="285" height="92" rx="18" fill="#0d1020" stroke="#ffad2f" stroke-width="2"/><circle cx="35" cy="46" r="18" fill="#ffad2f" opacity=".18"/><text x="70" y="52" class="label">LeetCode</text><text x="70" y="72" class="sub">problems &amp; progress</text></g>
 <g transform="translate(70 399)"><rect width="285" height="92" rx="18" fill="#0d1020" stroke="#ff3fb4" stroke-width="2"/><circle cx="35" cy="46" r="18" fill="#ff3fb4" opacity=".18"/><text x="70" y="52" class="label">Codeforces</text><text x="70" y="72" class="sub">competitive activity</text></g>
 <g transform="translate(1245 399)"><rect width="285" height="92" rx="18" fill="#0d1020" stroke="#ff405e" stroke-width="2"/><circle cx="35" cy="46" r="18" fill="#ff405e" opacity=".18"/><text x="70" y="52" class="label">Codewars</text><text x="70" y="72" class="sub">kata &amp; practice</text></g>
 <g transform="translate(100 690)"><rect width="320" height="92" rx="18" fill="#0d1020" stroke="#22bfff" stroke-width="2"/><circle cx="35" cy="46" r="18" fill="#22bfff" opacity=".18"/><text x="70" y="52" class="label">Stack Overflow</text><text x="70" y="72" class="sub">community activity</text></g>
